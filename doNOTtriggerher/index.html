<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do not trigger whim</title>
    <link rel="icon" type="image/png" href="images/ix.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>do not trigger whim</h1>
    
    <img id="whim-img" src="images/normal.png" alt="whim default">

    <div id="mood-panel">
        <div id="mood-bar-wrap">
            <div id="mood-bar-fill"></div>
        </div>
        <div id="mood-text">mood: 0</div>
        <div id="mood-message"></div>
    </div>
    <div id="stats">
        <div id="trigger-count">trigger count: 0</div>
        <div id="happy-count">happy count: 0</div>
    </div>
    
    <input type="text" id="user-input" placeholder="say something normal" autocomplete="off">
    <script src="script.js"></script>
</body>
</html>
